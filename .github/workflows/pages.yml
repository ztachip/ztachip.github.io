name: Deploy site

# This repository holds the generated documentation site, built in
# ztachip/ztachip with tools/docs/publish.sh and committed here. Pages is
# configured with "GitHub Actions" as its source, so the contents of the
# repository are published by this workflow rather than served directly
# from the branch.

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  deploy:
    runs-on: ubuntu-latest
    name: 'Publish to GitHub Pages'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: '💾 Checkout'
        uses: actions/checkout@v4

      - name: '📄 Configure Pages'
        uses: actions/configure-pages@v5

      - name: '📦 Upload site'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: '🚀 Deploy'
        id: deployment
        uses: actions/deploy-pages@v4
