site_name: ztachip Documentation
site_url: https://ztachip.github.io/
repo_url: https://github.com/ztachip/ztachip
repo_name: ztachip/ztachip

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Technical Overview: technical-overview.md
  - Hardware Architecture: hardware-architecture.md
  - Programmer Guide: programmer-guide/index.md
  - Vision AI Stack Programmer Guide: vision-ai-stack-programmer-guide/index.md
  - MicroPython Programmer Guide: micropython-programmer-guide.md

markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true

extra_css:
  - _static/custom.css
